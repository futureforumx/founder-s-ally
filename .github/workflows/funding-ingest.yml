# Daily funding / venture deal ingestion (Prisma → Postgres).
#
# Schedule: 4:00 AM America/Los_Angeles. GitHub `cron` is UTC-only; we trigger twice
# (11:00 and 12:00 UTC) so one run lands at 04:00 local across PDT (UTC-7) and PST (UTC-8).
# INGEST_REQUIRE_PACIFIC_HOUR + INGEST_PACIFIC_TARGET_HOUR=4 ensures only that window runs work.
#
# Secrets: DATABASE_URL (required). OPENAI_API_KEY (optional, improves extraction).
# Optional repo variable: INGEST_SKIP_SOURCES (e.g. GEEKWIRE_FUNDINGS) for sources blocked from datacenter IPs.

name: Funding ingest

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGEST_TRIGGER: github_actions
      INGEST_MAX_ARTICLES_PER_SOURCE: "40"
    steps:
      - name: Require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub secret DATABASE_URL is missing or empty. Latest funding on /fresh-capital will not update until it is set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma migrate (idempotent)
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest funding articles
        run: pnpm run funding:ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_SKIP_SOURCES: ${{ vars.INGEST_SKIP_SOURCES }}
          INGEST_REQUIRE_PACIFIC_HOUR: ${{ github.event_name == 'schedule' && '1' || '0' }}
          INGEST_PACIFIC_TARGET_HOUR: "4"
          INGEST_SKIP_PACIFIC_GUARD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Market intel (link deals → entities + rollups)
        run: pnpm run intel:funding:pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
