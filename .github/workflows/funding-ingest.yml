# Daily funding / venture deal ingestion (Prisma → Postgres).
#
# Schedule: 11:00 UTC daily (4:00 AM PDT / 3:00 AM PST). Single cron — no Pacific-hour
# guard and no second runner for DST.
#
# Secrets: DATABASE_URL (required). OPENAI_API_KEY (optional, improves extraction).
# Optional: INGEST_FETCH_PROXY_URL — Cloudflare Worker that allowlists geekwire.com.

name: Funding ingest

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INGEST_TRIGGER: github_actions
      INGEST_MAX_ARTICLES_PER_SOURCE: "40"
      INGEST_STARTUPS_GALLERY_MAX: "500"
    steps:
      - name: Require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub secret DATABASE_URL is missing or empty. Latest funding on /fresh-capital will not update until it is set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Prisma migrate (idempotent)
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run shared feeds
        run: pnpm run ingest:shared-feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest funding articles
        run: pnpm run funding:ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_FETCH_PROXY_URL: ${{ secrets.INGEST_FETCH_PROXY_URL }}

      - name: Market intel (link deals → entities + rollups)
        run: pnpm run intel:funding:pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
